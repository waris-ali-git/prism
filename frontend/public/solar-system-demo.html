<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solar System Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">

   {solar:"speed",value:0-100}, {solar:"tour",on:true}. Keys: sun mercury venus earth moon mars jupiter saturn uranus neptune */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#02030a;color:#fff;font-family:Manrope,system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 50%,#0b1030 0%,#03040d 70%)}
#view,#view canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;pointer-events:auto;font:600 12px Manrope,sans-serif;color:#fff;background:rgba(8,12,30,.55);border:1px solid rgba(255,255,255,.28);padding:3px 10px;border-radius:99px;cursor:pointer;white-space:nowrap;backdrop-filter:blur(6px)}
.lb.on{background:#fff;color:#111}
.glass{position:absolute;background:rgba(12,16,36,.6);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px}
#card{left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));width:min(500px,calc(100% - 28px));padding:14px 18px}
#card h2{margin:0 0 2px;font-size:1.15rem}
#card .ur{font-family:"Noto Nastaliq Urdu",serif;direction:rtl;text-align:right;font-size:1.02rem;line-height:2.1;margin:2px 0}
#card p{margin:0;font-size:.85rem;color:#c9cfe6}
#card .sz{margin-top:6px;font-size:.78rem;color:#9fb0ff;line-height:1.6}
#ctl{top:max(14px,env(safe-area-inset-top));left:14px;padding:12px 14px;width:200px;display:grid;gap:8px;font-size:.8rem}
#ctl label{display:flex;justify-content:space-between}
#ctl input{width:100%;accent-color:#ffb86b}
.row{display:flex;gap:6px;flex-wrap:wrap}
button.b{font:600 .76rem Manrope,sans-serif;flex:1;padding:6px 8px;border-radius:99px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;cursor:pointer}
button.b.on{background:#fff;color:#111}
#msg{display:none;position:absolute;inset:0;align-items:center;justify-content:center;padding:24px;text-align:center;color:#cfd6f0}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.embed #ctl{display:none}
@media (max-width:620px){#ctl{width:160px;padding:8px 10px}}
</style>
</head>

 const up=e=>{pts.delete(e.pointerId);el.style.cursor="grab";if(drag&&!drag.moved&&e.type==="pointerup"){const r=el.getBoundingClientRect();mo.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);rc.setFromCamera(mo,cam);
   const h=rc.intersectObjects(pick,false)[0];setTour(false);if(h)choose(h.object.userData.key);else{sel=null;ui()}}if(!pts.size)drag=null};
 el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
 el.addEventListener("wheel",e=>{e.preventDefault();R0=Math.min(400,Math.max(4,R0*(1+e.deltaY*.001)))},{passive:false});
 const LB={};KEYS.forEach(k=>{const b=document.createElement("button");b.className="lb";b.textContent=ORG[k].n;b.onclick=()=>{setTour(false);choose(k)};$("labels").appendChild(b);LB[k]=b});
 function setTour(on){tour=on;tourT=0;$("tourB").classList.toggle("on",on);if(on){tourI=0;sel=KEYS[0];ui()}}

 const setSp=v=>{st.sp=v;$("sp").value=v;$("spO").textContent=(v/40).toFixed(1)+"×"};$("sp").oninput=e=>setSp(+e.target.value);setSp(40);
 addEventListener("message",e=>{const d=e.data||{};if(d.solar==="select"&&ORG[d.key]){setTour(false);sel=d.key;ui()}else if(d.solar==="speed")setSp(+d.value);else if(d.solar==="tour")setTour(!!d.on)});

  tgt.lerp(goal,.08);rad+=(want-rad)*.06;
  cam.position.set(tgt.x+rad*Math.sin(ph)*Math.sin(th),tgt.y+rad*Math.cos(ph),tgt.z+rad*Math.sin(ph)*Math.cos(th));cam.lookAt(tgt);
  renderer.render(scene,cam);

  KEYS.forEach(kk=>{const b=LB[kk],o=body[kk];(o.o.getWorldPosition?o.o.getWorldPosition(tmp):tmp.copy(o.o.position));tmp.y+=o.r*1.4;tmp.project(cam);
   const ok=show&&tmp.z<1&&Math.abs(tmp.x)<1.05&&Math.abs(tmp.y)<1.05;b.style.display=ok?"block":"none";
   if(ok){b.style.transform=`translate(${(tmp.x*.5+.5)*w}px,${(-tmp.y*.5+.5)*h}px) translate(-50%,-100%)`;b.classList.toggle("on",kk===sel)}});
 }
 requestAnimationFrame(loop);
}
