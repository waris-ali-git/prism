<title>Human Cell Demo</title>

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#070a16;color:#fff;font-family:Manrope,system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,#2a3b66 0%,#121a34 55%,#070a16 100%)}
#view,#view canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 160px rgba(0,0,0,.6)}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;pointer-events:auto;font:600 12px Manrope,sans-serif;color:#fff;background:rgba(10,14,30,.6);border:1px solid rgba(255,255,255,.3);padding:3px 10px;border-radius:99px;cursor:pointer;white-space:nowrap;backdrop-filter:blur(6px);transition:background .25s,color .25s}
.lb.on{background:#fff;color:#111}
.glass{position:absolute;background:rgba(14,18,38,.58);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px}
#card{left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));width:min(470px,calc(100% - 28px));padding:14px 18px;transition:opacity .3s}
#card h2{margin:0 0 2px;font-size:1.15rem}
#card .ur{font-family:"Noto Nastaliq Urdu",serif;direction:rtl;text-align:right;font-size:1.02rem;line-height:2.1;margin:2px 0}
#card p{margin:0;font-size:.85rem;color:#c9cfe6}
#card .sz{margin-top:6px;font-size:.78rem;color:#9fb0ff}
#ctl{top:max(14px,env(safe-area-inset-top));left:14px;padding:12px 14px;width:210px;display:grid;gap:8px;font-size:.8rem}
#ctl label{display:flex;justify-content:space-between}
#ctl input[type=range]{width:100%;accent-color:#b79cff}
.row{display:flex;gap:6px}
button.b{font:600 .78rem Manrope,sans-serif;flex:1;padding:6px 8px;border-radius:99px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;cursor:pointer}
button.b.on{background:#fff;color:#111}
#prog{top:max(14px,env(safe-area-inset-top));right:14px;padding:6px 14px;font-size:.8rem;font-weight:600}
#msg{display:none;position:absolute;inset:0;align-items:center;justify-content:center;padding:24px;text-align:center;color:#cfd6f0}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.embed #ctl,.embed #prog{display:none}
@media (max-width:620px){#ctl{width:170px;padding:8px 10px}#card{width:calc(100% - 28px)}}

.goog-te-gadget-simple{background:rgba(255,255,255,.12)!important;border:1px solid rgba(255,255,255,.3)!important;padding:4px 8px!important;border-radius:99px!important;font-size:12px!important;color:#fff!important;display:flex!important;align-items:center!important;cursor:pointer}
.goog-te-gadget-simple .goog-te-menu-value span{color:#fff!important;border-left:none!important}
.goog-te-gadget-icon{display:none!important}
.goog-te-banner-frame{display:none!important}
body{top:0px!important}
.skiptranslate>iframe{display:none!important}
