<!DOCTYPE html>
<html lang="en">
<head>

<title>Prism Dispersion Demo</title>

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#03040a;color:#fff;font-family:Manrope,system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;background:radial-gradient(ellipse at 45% 50%,#101634 0%,#04050c 70%)}

.glass{position:absolute;background:rgba(12,16,36,.6);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px}
#card{left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));width:min(520px,calc(100% - 28px));padding:14px 18px}
#card h2{margin:0 0 2px;font-size:1.1rem}
#card .ur{font-family:"Noto Nastaliq Urdu",serif;direction:rtl;text-align:right;font-size:1rem;line-height:2.1;margin:2px 0}
#card p{margin:0;font-size:.82rem;color:#c9cfe6}
#card .rd{margin-top:6px;font-size:.78rem;color:#9fb0ff;line-height:1.6}
#ctl{top:max(14px,env(safe-area-inset-top));left:14px;padding:12px 14px;width:226px;display:grid;gap:7px;font-size:.78rem}
#ctl label{display:flex;justify-content:space-between}
#ctl input{width:100%;accent-color:#b79cff}
.row{display:flex;gap:5px;flex-wrap:wrap}
button.b{font:600 .72rem Manrope,sans-serif;flex:1;padding:5px 8px;border-radius:99px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;cursor:pointer;white-space:nowrap}
button.b.on{background:#fff;color:#111}
#spec{top:max(14px,env(safe-area-inset-top));right:14px;padding:10px 14px;width:min(250px,calc(100% - 270px));min-width:200px;font-size:.74rem}
#sb{position:relative;height:22px;border-radius:8px;margin:6px 0 4px;cursor:crosshair;touch-action:none}
#mk{position:absolute;top:-3px;bottom:-3px;width:3px;background:#fff;border-radius:2px;display:none;box-shadow:0 0 8px #fff}
#msg{display:none;position:absolute;inset:0;align-items:center;justify-content:center;padding:24px;text-align:center;color:#cfd6f0}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.embed #ctl,.embed #spec{display:none}
@media (max-width:700px){#spec{top:auto;bottom:auto;right:14px;left:14px;width:auto;min-width:0;top:max(228px,calc(env(safe-area-inset-top) + 214px))}#ctl{width:200px}}
</style>
</head>
<body>
<div id="stage">
  <div id="view"></div>
  <div class="glass" id="ctl">
    <label for="inc">Angle of incidence <output id="incO"></output></label><input id="inc" type="range" min="0" max="80" step=".5" value="52">
    <label for="ap">Prism apex angle <output id="apO"></output></label><input id="ap" type="range" min="30" max="75" value="60">
    <label for="bo">Dispersion boost <output id="boO"></output></label><input id="bo" type="range" min="1" max="8" step=".5" value="3">
    <label for="br">Brightness <output id="brO"></output></label><input id="br" type="range" min="30" max="200" value="100">
    <div class="row" id="gl"></div>
    <div class="row"><button class="b" id="swB">Sweep angle</button></div>
  </div>
  <div class="glass" id="spec"><b>Pick a color</b> (tap the bar)<div id="sb"><div id="mk"></div></div><div class="row"><button class="b" id="allB">All colors</button></div></div>
  <div class="glass" id="card"></div>
  <div id="msg">3D needs WebGL, which is turned off on this device.</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

const $=id=>document.getElementById(id),V=(x,y,z)=>new THREE.Vector3(x,y,z);

const S={inc:52,ap:60,bo:3,br:1,g:"flint",sw:false,selJ:-1};
